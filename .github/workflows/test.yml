# Lints and tests hey-shell on Linux (bash 5) and macOS (the system bash 3.2, Homebrew's bash 5 and zsh) on
# every push to main and every pull request. Claude is never called: the tests use a fake `claude`.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh shellcheck

      - name: Install shellcheck and bash 5
        if: runner.os == 'macOS'
        run: brew install shellcheck bash

      - name: Shells under test
        run: |
          for sh in /bin/bash /usr/bin/bash /opt/homebrew/bin/bash "$(command -v zsh)"; do
            [ -x "$sh" ] && "$sh" -c 'echo "$0 ${BASH_VERSION:-$ZSH_VERSION}"'
          done
          true

      - name: Lint
        run: ./test/lint.sh

      - name: Test
        run: ./test/run.sh
